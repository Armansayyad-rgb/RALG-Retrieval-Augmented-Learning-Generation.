name: RALG CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          python -m pip install -r requirements.txt pytest pyyaml

      - name: Compile active Python runtime sources
        run: |
          python -m compileall -q config.py src

      - name: Validate benchmark JSONL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/technical_doc_benchmark_v1.jsonl"),
              Path("data/technical_doc_benchmark_hard_v1.jsonl"),
          ]
          for path in files:
              assert path.exists(), f"missing benchmark: {path}"
              rows = 0
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  assert "question" in item, f"{path}:{line_no} missing question"
                  assert "supported" in item, f"{path}:{line_no} missing supported flag"
                  rows += 1
              assert rows > 0, f"empty benchmark: {path}"
              print(f"validated {path}: {rows} cases")
          PY

      - name: Validate project configuration
        run: |
          python - <<'PY'
          import config
          from pathlib import Path
          assert Path(config.PROJECT_ROOT).name
          assert isinstance(config.KNOWLEDGE_FILES, list)
          assert config.MAX_INPUT_TOKENS > 0
          assert config.MAX_NEW_TOKENS > 0
          assert 0.0 <= config.CONFIDENCE_THRESHOLD <= 1.0
          print("configuration import OK")
          PY

      - name: Check Docker entrypoint module exists
        run: |
          test -f src/webui/app.py
          test -f src/webui_bootstrap.py
          grep -Fq 'CMD ["python", "-m", "webui_bootstrap"]' Dockerfile

      - name: Check required public files
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f BENCHMARK_RESULTS.md
          test -f RELIABILITY_BENCHMARK.md
          test -f COMMERCIAL_READINESS.md

      - name: Run pure retrieval and API hardening tests
        run: |
          pytest -q \
            src/test_retrieval_performance.py \
            src/test_api_input_hardening.py \
            src/test_upload_provenance.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Reject accidentally committed secrets
        run: |
          test -z "$(find . -type f \( -name '.env' -o -name 'credentials.json' \
            -o -name 'secrets.json' -o -name 'secrets.yaml' -o -name 'secrets.yml' \
            -o -name '*.pem' -o -name '*.key' \) \
            -not -path './.git/*' -not -path './.venv/*' -print -quit)"
          ! grep -RInE --exclude-dir=.git --exclude-dir=.venv \
            --exclude-dir=stage5_documents \
            --exclude='*.md' --exclude='*.jsonl' \
            '(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}' .

      - name: Validate Stage 5 third-party corpus integrity
        run: |
          python scripts/stage5_prepare.py
