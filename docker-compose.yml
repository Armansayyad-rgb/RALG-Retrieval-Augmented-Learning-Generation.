# RALG Engine - one-command self-hosted stack.
#
# Usage:
#   docker compose up
#   docker compose up -d
#   docker compose down
#
# After `up`, open http://localhost:7860.
#
# Persistent volumes:
#   ralg_data        -> /app/data (runtime uploads are stored under /app/data/runtime_uploads)
#   ralg_logs        -> /app/logs
#   ralg_checkpoints -> /app/checkpoints
#
# The reasoning-model checkpoint is not distributed by this compose file.
# Place the expected checkpoint in the checkpoint volume or bind-mount your
# local checkpoint directory before expecting model-backed answers.

services:
  ralg-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: ralg-engine:latest
    container_name: ralg-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - AI_PROJECT_ROOT=/app
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=7860
      - NO_PROXY=localhost,127.0.0.1,::1
      - no_proxy=localhost,127.0.0.1,::1
      - MAX_INPUT_TOKENS=480
      - MAX_NEW_TOKENS=50
      - CONFIDENCE_THRESHOLD=0.80
    volumes:
      - ralg_data:/app/data
      - ralg_logs:/app/logs
      - ralg_checkpoints:/app/checkpoints
      # To use an existing host checkpoint directory instead, replace the
      # line above with e.g. ./checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  ralg_data:
  ralg_logs:
  ralg_checkpoints:
